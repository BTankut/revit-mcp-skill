name: Claude Code Review

# High-signal correctness reviewer + deterministic merge gate. Posts ONLY
# validated, high-confidence issues; stays quiet (one-line confirmation) on clean
# diffs. Has free read-only run of the whole repo (full history + blame) to follow
# a suspicious diff into the rest of the app.
# Pattern: anthropics/claude-code /code-review (HIGH SIGNAL only + validate-then-filter).
# Runs ONCE when the PR is marked ready (not on every push). Effort is risk-tiered
# (high default, xhigh when risk paths are touched). Emits a structured verdict
# that gates auto-merge (fail closed: no verdict / blocking issue => check goes RED).
# Model: Opus 5.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read          # read-only repo + git history; NO write
  pull-requests: write    # only to post review comments
  id-token: write

jobs:
  review:
    name: Claude review gate
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, revagent-ci]
    steps:
      - name: Checkout PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0          # full history + base branch -> git blame/log/diff base...head work

      - name: Prefer Git Bash on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitBashDirs = @(
            (Join-Path $env:ProgramFiles "Git\bin"),
            (Join-Path $env:ProgramFiles "Git\usr\bin")
          )
          $found = $false
          foreach ($dir in $gitBashDirs) {
            if (Test-Path -LiteralPath (Join-Path $dir "bash.exe") -PathType Leaf) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $found = $true
            }
          }
          if (-not $found) {
            throw "Git Bash was not found on the self-hosted runner."
          }

      - name: Resolve Claude Code executable
        id: resolve-claude
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command claude -ErrorAction SilentlyContinue
          if ($null -eq $command -or [string]::IsNullOrWhiteSpace($command.Source)) {
            $fallback = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
            if (Test-Path -LiteralPath $fallback -PathType Leaf) {
              "path=$fallback" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            throw "Claude Code executable was not found on the self-hosted runner PATH."
          }
          "path=$($command.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Determine review effort tier
        id: tier
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $baseRef = $env:BASE_REF
          git fetch --no-tags origin $baseRef | Out-Null
          $changed = @(git diff --name-only "origin/$baseRef...HEAD")
          # Paths where a missed review is expensive: C# Revit plugin source, the
          # committed plugin/installer payload, signing/publish/NAS scripts, and the
          # signing CD workflow. Globs are regex (used with -match) and fail safe:
          # an over-match only raises effort to xhigh, never lowers it.
          # (Add a structural/CSI-OAPI glob here when that module lands.)
          $riskGlobs = @(
            '^src/revit-plugin/',
            '^installer/',
            '^scripts/.*sign',
            '^scripts/publish',
            '^scripts/.*nas',
            '^scripts/invoke-signed',
            '^\.github/workflows/signed-source-free-cd\.yml$'
          )
          $effort = 'high'
          foreach ($f in $changed) {
            foreach ($g in $riskGlobs) {
              if ($f -match $g) { $effort = 'xhigh'; break }
            }
            if ($effort -eq 'xhigh') { break }
          }
          "effort=$effort" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Review effort tier: $effort (changed files: $($changed.Count))"

      - name: Claude PR review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.resolve-claude.outputs.path }}
          # classify_inline_comments left at DEFAULT "true": buffers unconfirmed
          # subagent/probe comments and filters them before posting after the session.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is checked out locally with full git history. Gather context:
            `gh pr view` (title/body/labels) and `gh pr diff` (the canonical changed lines).
            Then INVESTIGATE FREELY: use Read / Grep / Glob and read-only git
            (git log / show / blame / diff / grep) to follow any suspicious change into
            the rest of the codebase before drawing a conclusion. Do not limit yourself
            to the diff - verify how changed code is actually used elsewhere.

            MIGRATION FEATURE FREEZE (P8-T8; mandatory blocking rule):
            - Frozen paths are installer/runtime-mcp-server/src/tools/** and
              src/revit-plugin/**.
            - Read the PR labels with `gh pr view`. If the diff touches either frozen
              path and the exact `migration-freeze-exception` label is absent, post one
              verified `important:` inline comment on a frozen-path change and return a
              blocking verdict. This is a documented-rule violation even if the code is
              otherwise correct.
            - The exception label is not blanket permission. When it is present, verify
              that the PR is an explicitly planned migration protocol/transport
              adaptation or has a dated exception recorded in docs/decisions/DP-log.md;
              otherwise flag it as blocking.
            - Do not propose legacy feature work as a fix. The old production path stays
              behavior-frozen until the migration freeze is formally lifted.

            CRITICAL: We only want HIGH SIGNAL issues. Flag an issue ONLY when, after
            checking it against the real code, one of these clearly holds:
            - the code will fail to compile/parse (syntax/type error, missing import,
              unresolved reference), OR
            - the code will definitely produce wrong results regardless of input
              (clear logic error, broken edge case, wrong condition, off-by-one,
              transaction/resource misuse), OR
            - a real security, data-loss, or regression risk you can demonstrate, OR
            - a clear, unambiguous violation of a documented project rule (quote it).

            Do NOT flag, and do NOT comment about:
            - code style, formatting, naming, or subjective "improvements"/refactors
            - pre-existing issues not introduced by this PR
            - anything a linter or type-checker already catches
            - missing tests or general coverage/quality unless a documented rule requires it
            - issues that merely MIGHT occur depending on inputs/state you cannot verify
            - pedantic nitpicks a senior engineer would not raise

            Before posting, re-check each issue once against the actual code. If you are
            not certain it is real, DO NOT post it - false positives erode trust. Do not
            invent issues to fill space and do not write filler sections: zero findings is
            a perfectly good result.

            Output - ALWAYS post exactly ONE top-level `gh pr comment` (never stay silent,
            so there is always visible proof the review ran):
            - If there are NO high-signal issues, the top-level comment is EXACTLY
              "No blocking issues found." and nothing else.
            - If there ARE issues, OPEN the top-level comment with a one-line tally
              (e.g. "2 important, 3 nits") and do not restate the inline comments as
              sections. For each VERIFIED issue post ONE inline comment via
              mcp__github_inline_comment__create_inline_comment with confirmed: true,
              prefixed "important:" (fix before merge) or "nit:" (minor). One comment per
              unique issue, no duplicates. Add a ```suggestion block only when applying it
              fully fixes the issue. Post at most ~5 nits; if more, give the remaining
              count in the tally.

            Your human-readable review belongs ONLY in GitHub comments (above) -
            never narrate it as plain chat prose. The single exception is the
            machine verdict below, which MUST be your final message.

            MACHINE VERDICT (required - this is the merge gate): after every
            GitHub comment is posted, your VERY LAST assistant message must be
            EXACTLY one JSON object matching the provided schema and nothing else -
            no prose, no markdown, no code fences, no leading or trailing text. If
            this JSON is missing or invalid the PR is blocked from merging (fail
            closed), so do not skip it even when the review is clean.
            - blocking = true  -> you posted at least one "important:" issue that
              must be fixed before merge.
            - blocking = false -> clean, or only "nit:" comments.
            - tally = the same one-line tally you used in the top-level comment
              (or "No blocking issues found." when clean).
          claude_args: |
            --model claude-opus-5
            --effort ${{ steps.tier.outputs.effort }}
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"tally":{"type":"string"}},"required":["blocking","tally"]}'
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git grep:*),Bash(rg:*),Bash(grep:*),Bash(find:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --disallowedTools "Edit,Write,MultiEdit,Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(rm:*)"

      # Deterministic merge gate. Fail closed: the check goes RED unless Claude
      # ran successfully AND returned a structured verdict AND that verdict is
      # non-blocking. The model output is read from env (data, never code) so a
      # crafted verdict string cannot inject PowerShell.
      - name: Enforce review verdict
        if: ${{ always() }}
        shell: pwsh
        env:
          # claude-code-action@v1 exposes NO `conclusion` output; use the step
          # status context instead. On the workflow-self-edit skip path the step
          # still reports success but structured_output is empty -> caught below.
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_OUT: ${{ steps.review.outputs.structured_output }}
          REVIEW_EXEC: ${{ steps.review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          function Add-ClaudeReviewGateFailureComment {
            param([Parameter(Mandatory = $true)][string]$Message)

            $body = @"
          Claude review gate could not produce a structured verdict.

          $Message

          Run: $($env:RUN_URL)

          Merge remains blocked fail-closed.
          <!-- revagent-claude-review-gate-technical-failure -->
          "@
            try {
              gh pr comment $env:PR_NUMBER --body $body | Out-Null
            }
            catch {
              Write-Warning "Failed to post Claude review gate failure comment: $($_.Exception.Message)"
            }
          }

          function Stop-ClaudeReviewGate {
            param([Parameter(Mandatory = $true)][string]$Message)

            Add-ClaudeReviewGateFailureComment -Message $Message
            throw $Message
          }

          $outcome = $env:REVIEW_OUTCOME
          if ($outcome -ne "success") {
            Stop-ClaudeReviewGate -Message "Claude review step did not succeed (outcome=$outcome); blocking merge (fail closed)."
          }
          $out = $env:REVIEW_OUT
          if ([string]::IsNullOrWhiteSpace($out)) {
            Stop-ClaudeReviewGate -Message "Claude review produced no structured verdict (empty structured_output); blocking merge (fail closed). Likely cause: a workflow-validation skip (this PR edits claude-review.yml) or a non-JSON final message. execution_file=$($env:REVIEW_EXEC)"
          }
          try {
            $verdict = $out | ConvertFrom-Json
          }
          catch {
            Stop-ClaudeReviewGate -Message "Claude review returned invalid structured JSON; blocking merge (fail closed). Error: $($_.Exception.Message)"
          }
          if ($verdict.blocking) {
            throw "Claude review found blocking issue(s): $($verdict.tally)"
          }
          Write-Host "Claude review verdict: non-blocking ($($verdict.tally))." -ForegroundColor Green
